name: advocate_app
description: "Case diary for Indian advocates"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  animations: ^3.0.0
  crypto: ^3.0.7
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  intl: ^0.20.3
  local_auth: ^3.0.2
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    # Mukta covers Latin + Devanagari (SIL OFL). Bundled so the app never fetches fonts at runtime.
    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta/Mukta-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mukta/Mukta-Medium.ttf
          weight: 500
        - asset: assets/fonts/Mukta/Mukta-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mukta/Mukta-Bold.ttf
          weight: 700
    # Phosphor icons (MIT). Vendored: the phosphor_flutter package no longer builds on current Flutter.
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor/Phosphor-Fill.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor/Phosphor-Bold.ttf
