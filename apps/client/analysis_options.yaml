include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - lib/core/l10n/gen/**
    - "**/*.g.dart"
    - android/**
    - ios/**
    - windows/**

linter:
  rules:
    public_member_api_docs: false   # app code, not a published package
    lines_longer_than_80_chars: false  # dart format wraps at 80; long strings/ARB keys are fine
    unnecessary_type_name_in_constructor: false  # keep the conventional Flutter constructor style
