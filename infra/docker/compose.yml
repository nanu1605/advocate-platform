# Local backend (ADR 0002). Supabase runs separately via `npx supabase start` (ports 553xx).
# `just dev` starts Supabase + this file.
name: advocate

x-python: &python
  build:
    context: ../..
    dockerfile: infra/docker/python.Dockerfile
  env_file:
    - path: ../../.env
      required: false
  environment:
    APP_ENV: local
    REDIS_URL: redis://redis:6379/0
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@host.docker.internal:55322/postgres
    SUPABASE_URL: http://127.0.0.1:55321   # token issuer as the app sees it
    SUPABASE_JWKS_URL: http://host.docker.internal:55321/auth/v1/.well-known/jwks.json
    SUPABASE_INTERNAL_URL: http://host.docker.internal:55321   # Storage, as the containers reach it
    CLAMAV_URL: tcp://clamav:3310
  extra_hosts:
    - host.docker.internal:host-gateway
  depends_on: [redis]

services:
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]

  # BGE-M3 and the reranker (spec §12.4): about 5 GB of image, so only on request:
  #   docker compose -f infra/docker/compose.yml --profile embedder up -d embedder
  # then set EMBEDDER_URL=http://embedder:8001 in .env (http://127.0.0.1:8001 for tests on the host). Without it,
  # search uses full text alone.
  embedder:
    build:
      context: ../..
      dockerfile: infra/docker/embedder.Dockerfile
    profiles: [embedder]
    ports: ["8001:8001"]

  api:
    <<: *python
    command: uvicorn advocate_api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]

  worker:
    <<: *python
    command: celery -A advocate_workers.celery_app worker --loglevel=INFO

  # The beat's schedule (cause lists, post-hearing refresh, ...) runs on its own worker, so uploads and other user
  # jobs on the default queue never hold up the evening board (spec §4.2, §11.8).
  worker-scheduled:
    <<: *python
    command: celery -A advocate_workers.celery_app worker -Q scheduled --loglevel=INFO

  # Text extraction (OCR can take minutes per scan) on its own worker, one file at a time.
  worker-text:
    <<: *python
    command: celery -A advocate_workers.celery_app worker -Q text --concurrency=1 --loglevel=INFO

  # Order summaries and intelligence: each task mostly waits on the model (Bedrock), so a few run at once.
  worker-ai:
    <<: *python
    command: celery -A advocate_workers.celery_app worker -Q ai --concurrency=4 --loglevel=INFO

  beat:
    <<: *python
    # The app directory isn't writable by the container user: the schedule file goes to /tmp.
    command: celery -A advocate_workers.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule

  # Upload malware scan (spec §4.3): clamd, a separate process the worker streams files to (INSTREAM on 3310).
  # First start downloads the signatures (a few minutes, ~1 GB RAM once loaded); until then uploads stay pending.
  clamav:
    image: clamav/clamav:1.5.4
    environment:
      CLAMD_CONF_StreamMaxLength: 60M   # uploads are at most 50 MB; clamd closes the stream past this
      # A file past a scan limit (archive entries, nesting, size, MaxScanTime) is a FOUND verdict
      # (Heuristics.Limits.Exceeded.*), not "OK" for the part scanned. Production clamd needs the same setting.
      CLAMD_CONF_AlertExceedsMax: "yes"
    volumes:
      - clamav-db:/var/lib/clamav
    ports: ["3310:3310"]

  # Offline sync (ADR 0010): the open edition of the PowerSync service, for local development and CI only.
  powersync:
    image: journeyapps/powersync-service:1.27.1
    command: ["start", "-r", "unified"]
    volumes:
      - ../powersync:/config:ro
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      PS_DATA_SOURCE_URI: postgresql://postgres:postgres@host.docker.internal:55322/postgres
      PS_STORAGE_URI: postgresql://postgres:postgres@powersync-storage:5432/postgres
      PS_JWKS_URL: http://host.docker.internal:55321/auth/v1/.well-known/jwks.json
      PS_PORT: "8080"
      PS_ADMIN_TOKEN: local-admin-token
    extra_hosts:
      - host.docker.internal:host-gateway
    ports: ["55380:8080"]
    depends_on:
      powersync-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/probes/liveness').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 2s
      retries: 30

  # Bucket storage for the sync service; disposable (it re-replicates on start).
  powersync-storage:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  clamav-db:
