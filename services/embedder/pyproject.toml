[project]
name = "advocate-embedder"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
# The real models: the embedder image installs these (infra/docker/embedder.Dockerfile). Tests use the fake.
models = [
    "sentence-transformers>=6.2",
    "torch>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advocate_embedder"]
