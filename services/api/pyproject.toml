[project]
name = "advocate-api"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "advocate-shared",
    "court-data",
    "celery[redis]",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pyjwt[crypto]",
    "redis",
    "standardwebhooks",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advocate_api"]
