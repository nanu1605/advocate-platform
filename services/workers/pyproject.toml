[project]
name = "advocate-workers"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "advocate-shared",
    "court-data",
    "celery[redis]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "redis",
    "httpx",
    "pypdfium2>=5.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advocate_workers"]
