[project]
name = "advocate-shared"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = ["court-data", "legal-ai", "pydantic-settings", "sqlalchemy[asyncio]", "structlog"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advocate_shared"]
