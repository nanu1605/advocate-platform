name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  backend:
    name: Backend (lint, pgTAP, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.26"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: uv sync --frozen
      - name: Lint and generated-file checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run python tools/brand_sync.py --check
          uv run python tools/gen_seed.py --check
          uv run python tools/check_contrast.py
      - name: Start local Supabase
        run: |
          uv run python tools/dev_env.py
          npx supabase start --exclude studio,imgproxy,mailpit
      - name: Row-level security tests (pgTAP)
        run: npx supabase test db
      - name: Start local sync service
        run: docker compose -f infra/docker/compose.yml up -d --wait powersync
      - name: API, worker and sync tests
        run: uv run pytest -q

  flutter:
    name: Flutter (format, analyze, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --exclude-tags golden
      - name: Pseudo-locale overflow check (English +40%)
        run: python3 ../../tools/pseudo_l10n.py flutter test test/widget

  goldens:
    name: Goldens (Windows renderer)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --tags golden
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: apps/client/test/golden/failures/

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --debug
