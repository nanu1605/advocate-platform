[project]
name = "advocate-platform"
version = "0.0.0"
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/shared", "packages/legal_ai", "packages/court_data", "services/api", "services/workers",
    "services/embedder",
]

[tool.uv.sources]
advocate-shared = { workspace = true }
legal-ai = { workspace = true }
court-data = { workspace = true }
advocate-api = { workspace = true }
advocate-workers = { workspace = true }
advocate-embedder = { workspace = true }
# CPU builds: the embedder runs on CPU (spec stack), and the default Linux wheel pulls in gigabytes of CUDA.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "advocate-shared",
    "legal-ai",
    "court-data",
    "advocate-api",
    "advocate-workers",
    "advocate-embedder",  # without its models: tests use the fake
    "ruff",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pillow",
    "pre-commit",
    "pyyaml",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["docs"]  # spike scripts run inside their own containers

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]  # asserts are the self-checks

[tool.ruff.lint.isort]
known-first-party = [
    "advocate_api", "advocate_embedder", "advocate_shared", "advocate_workers", "court_data", "legal_ai",
]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["S603", "S608"]  # dev scripts: seed SQL from repo-owned YAML; commands come from the developer
"**/tests/*" = ["S105", "S106", "S608"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["packages", "services", "tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["packages", "services"]
